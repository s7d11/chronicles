[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicles"
version = "0.1.0"
description = "The Sebeni Chronicle — Newspaper blog & live MALI13 benchmarking pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["bench*", "swarm_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
